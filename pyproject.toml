[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "png2eps"
version = "0.1.0"
description = "Pixel-perfect PNG to Illustrator-compatible EPS & SVG converter"
authors = [{ name = "Den" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pillow>=9.0.0",
]

[project.scripts]
png2eps = "png2eps:main"
png2svg = "png2eps:main"
